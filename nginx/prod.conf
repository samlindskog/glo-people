# Production: nginx runs on the host network behind Cloudflare (Full strict, origin cert).
# nftables only admits :443 from Cloudflare's ranges; real client IPs come from CF-Connecting-IP.
include /etc/nginx/cloudflare-realip.conf;   # set_real_ip_from lines, generated by deploy/cf-ips.sh
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name x9bc433.win;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Authenticated Origin Pulls: Cloudflare presents a client cert signed by our private CA.
    # /etc/nginx/aop.conf holds `ssl_verify_client optional;` or `ssl_verify_client on;`.
    ssl_client_certificate /etc/nginx/certs/aop-ca.pem;
    ssl_verify_depth 1;
    include /etc/nginx/aop.conf;

    server_tokens off;
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Server-Sent Events (tool invocations, assistant runs): never buffered, long-lived.
    location ~ ^/api/.*/events$ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api;
        include /etc/nginx/conf.d/proxy-headers.inc;   # HTTP/1.1 and an empty Connection header
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /mcp {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The board editor's preview iframe loads the public site's stylesheet and fonts from here.
    location /glojobs/static/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api;
        include /etc/nginx/conf.d/proxy-headers.inc;
        expires 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

# glojobs.app: the public boards (app.glojobs). Every path maps onto the API's /glojobs/ prefix;
# the main host above never proxies that prefix, so a board is reachable only through this name.
# The origin certificate is the one issued in the glojobs.app zone (certs/glojobs-origin.*).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name glojobs.app www.glojobs.app;

    ssl_certificate     /etc/nginx/certs/glojobs-origin.pem;
    ssl_certificate_key /etc/nginx/certs/glojobs-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    ssl_client_certificate /etc/nginx/certs/aop-ca.pem;
    ssl_verify_depth 1;
    include /etc/nginx/aop.conf;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    location /static/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api/glojobs/static/;
        include /etc/nginx/conf.d/proxy-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api/glojobs/;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
