map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The access log goes to the API over syslog as JSON lines (app.ops), as in prod.
log_format ops escape=json '{"ts":"$time_iso8601","host":"$host","method":"$request_method",'
                           '"path":"$request_uri","status":$status,"ms":$request_time,'
                           '"ip":"$remote_addr","ua":"$http_user_agent","ray":"$http_cf_ray",'
                           '"up":"$upstream_status","bytes":$body_bytes_sent}';
access_log syslog:server=api:5140,tag=nginx,nohostname ops;

server {
    listen 80;
    client_max_body_size 25m;

    # Server-Sent Events (tool invocations, assistant runs): never buffered, long-lived.
    location ~ ^/api/.*/events$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # glojobs.app boards, reachable in dev through the prefix (http://localhost:8080/glojobs/<uuid>)
    location /glojobs/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
