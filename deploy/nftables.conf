#!/usr/sbin/nft -f
# glousfr1 host firewall. Only touches table inet filter so Docker's and fail2ban's tables
# survive `systemctl reload nftables`.
table inet filter
delete table inet filter

table inet filter {
  set cloudflare_v4 { type ipv4_addr; flags interval; }
  set cloudflare_v6 { type ipv6_addr; flags interval; }

  # api.github.com/meta ".actions" (v4 only), refreshed daily by glo-cf-ips.timer. The CI deploy
  # port 2222 accepts these sources and nothing else, so the `deploy` key is useless off-runner.
  set github_actions_v4 { type ipv4_addr; flags interval; }

  chain input {
    type filter hook input priority filter; policy drop;
    ct state invalid drop
    ct state established,related accept
    iif "lo" accept
    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
    meta l4proto ipv6-icmp accept
    tcp dport 22 ct state new accept
    tcp dport 2222 ip saddr @github_actions_v4 ct state new accept comment "CI deploy: GitHub Actions runners only"
    tcp dport 443 ip saddr @cloudflare_v4 accept
    tcp dport 443 ip6 saddr @cloudflare_v6 accept
    # The ops tunnel (deploy/ops-tunnel.sh): WireGuard from anywhere (the key is the gate), the
    # ops port only from the laptop's tunnel address on the tunnel interface.
    udp dport 51821 accept comment "ops tunnel: WireGuard wg1"
    iifname "wg1" ip saddr 10.89.0.2 tcp dport 8800 ct state new accept comment "ops MCP + health, laptop only"
  }
}

include "/etc/nftables.d/*.nft"
