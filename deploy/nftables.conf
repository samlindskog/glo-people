#!/usr/sbin/nft -f
# glousfr1 host firewall. Only touches table inet filter so Docker's and fail2ban's tables
# survive `systemctl reload nftables`.
table inet filter
delete table inet filter

table inet filter {
  set cloudflare_v4 { type ipv4_addr; flags interval; }
  set cloudflare_v6 { type ipv6_addr; flags interval; }

  chain input {
    type filter hook input priority filter; policy drop;
    ct state invalid drop
    ct state established,related accept
    iif "lo" accept
    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
    meta l4proto ipv6-icmp accept
    tcp dport 22 ct state new accept
    tcp dport 443 ip saddr @cloudflare_v4 accept
    tcp dport 443 ip6 saddr @cloudflare_v6 accept
  }
}

include "/etc/nftables.d/*.nft"
